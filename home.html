<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find My Partner AI</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="profile">

            <img
                src="https://i.pravatar.cc/100"
                class="avatar"
            >

            <div>

                <h2>
                    Welcome 👋
                </h2>

                <p>
                    Find My Partner AI
                </p>

            </div>

        </div>


        <div class="notify">
            🔔
        </div>

    </div>



    <!-- ONLINE USERS -->

    <div class="card">

        ❤️ <b>Online Users</b>

        <br>

        <span>
            1,245 Users Online
        </span>

    </div>



    <!-- REGISTER -->

    <button
        class="menu-btn"
        onclick="location.href='register.html'"
    >
        📝 Create Profile
    </button>



    <!-- FIND PARTNER -->

    <button
        class="menu-btn"
        onclick="location.href='find.html'"
    >
        🔥 Find Partner
    </button>



    <!-- CHATS -->

    <button
        class="menu-btn"
        onclick="location.href='chats.html'"
    >
        💬 Chats
    </button>



    <!-- MY PROFILE -->

    <button
        class="menu-btn"
        onclick="location.href='profile.html'"
    >
        👤 My Profile
    </button>



    <!-- MATCHES -->

    <button
        class="menu-btn"
        onclick="location.href='matches.html'"
    >
        💕 Matches
    </button>



    <!-- PREMIUM -->

    <button
        class="menu-btn"
        onclick="location.href='premium.html'"
    >
        ⭐ Premium
    </button>



    <!-- SETTINGS -->

    <button
        class="menu-btn"
        onclick="location.href='settings.html'"
    >
        ⚙️ Settings
    </button>



    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <div
            onclick="location.href='home.html'"
        >
            🏠
        </div>

        <div
            onclick="location.href='find.html'"
        >
            🔍
        </div>

        <div
            onclick="location.href='matches.html'"
        >
            ❤️
        </div>

        <div
            onclick="location.href='chats.html'"
        >
            💬
        </div>

        <div
            onclick="location.href='profile.html'"
        >
            👤
        </div>

    </div>


</div>



<!-- TELEGRAM -->

<script>

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


console.log(
    "Telegram WebApp initialized"
);


if (
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
) {

    const user =
        tg.initDataUnsafe.user;


    console.log(
        "Telegram User ID:",
        user.id
    );

}

</script>


</body>

</html>
