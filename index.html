<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find My Partner AI</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="container">

    <div class="logo">
        ❤️
    </div>

    <h1>Find My Partner AI</h1>

    <p>Find Genuine Connections</p>

    <button
        id="getStarted"
        type="button"
    >
        🚀 Get Started
    </button>

    <div id="telegramStatus"></div>

</div>


<script>

    // ==========================================
    // TELEGRAM WEB APP
    // ==========================================

    const tg = window.Telegram?.WebApp;

    if (tg) {

        tg.ready();
        tg.expand();

        console.log(
            "Telegram WebApp detected"
        );

        console.log(
            "initData:",
            tg.initData
        );

        console.log(
            "initData length:",
            tg.initData ? tg.initData.length : 0
        );

        if (
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            const user =
                tg.initDataUnsafe.user;

            console.log(
                "Telegram User ID:",
                user.id
            );

            console.log(
                "Telegram User:",
                user.first_name
            );

            document.getElementById(
                "telegramStatus"
            ).innerHTML =
                "Telegram Connected ✅<br>" +
                "User: " +
                (user.first_name || "User");

        } else {

            document.getElementById(
                "telegramStatus"
            ).innerHTML =
                "⚠️ Telegram User Not Found";

        }

    } else {

        document.getElementById(
            "telegramStatus"
        ).innerHTML =
            "⚠️ Open this app from Telegram";

    }


    // ==========================================
    // GET STARTED
    // ==========================================

    document
        .getElementById("getStarted")
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "home.html";

            }
        );

</script>

</body>
</html>
