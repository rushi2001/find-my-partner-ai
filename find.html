<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Partner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>🔥 Find Partner</h2>

    <div class="profile-card" id="profileCard">

        <img
            id="profilePhoto"
            class="profile-image"
        >

        <div class="profile-details">

            <h2 id="profileName"></h2>

            <p id="profileInfo"></p>

        </div>

    </div>

    <div class="action-buttons">

        <button
            class="skip-btn"
            onclick="skipProfile()">
            ❌
        </button>

        <button
            class="like-btn"
            onclick="likeProfile()">
            ❤️
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
